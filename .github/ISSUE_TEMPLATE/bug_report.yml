name: Bug report
description: Report a reproducible problem in HS Service Management System
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach customer databases, passwords, backups, or private information.
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "v3.2"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: How are you running the application?
      options:
        - Windows executable
        - Python source
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove all customer and credential information first.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed customer data, passwords, and other confidential information.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
