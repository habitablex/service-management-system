name: Feature request
description: Suggest an improvement to HS Service Management System
title: "[Feature]: "
labels: ["enhancement", "needs-review"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What business problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the desired behaviour.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: priority
    attributes:
      label: Importance to your workflow
      options:
        - Nice to have
        - Important
        - Blocking current use
    validations:
      required: true
